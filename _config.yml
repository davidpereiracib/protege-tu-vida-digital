title: Protege tu Vida Digital
description: >-
  Herramientas concretas para proteger tu identidad digital y para reconocer y
  verificar fraudes en Internet. Material de apoyo de los Focus Group de David Pereira — SecPro.
url: https://protege.secpro.co
lang: es

# Plugins incluidos por defecto en GitHub Pages.
# - optional-front-matter: renderiza los .md aunque no tengan cabecera YAML
# - relative-links: convierte los enlaces .md entre capitulos en URLs validas del sitio
# - titles-from-headings: usa el primer H1 como <title> de la pagina
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: true

titles_from_headings:
  enabled: true
  strip_title: false

# URLs de directorio (/fraudes/ en vez de /fraudes.html).
# No dependen de que el servidor adivine la extension: siempre hay un index.html.
#
# OJO: jekyll-optional-front-matter omite a proposito README.md y CONTRIBUTING.md
# por considerarlos archivos meta del repositorio, asi que NO se generan como paginas.
# Por eso el sitio usa index.md como portada y los capitulos enlazan a index.md,
# nunca a README.md. El README es solo la cara del repositorio en GitHub.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      permalink: "/:basename/"
  - scope:
      path: "index.md"
    values:
      permalink: "/"

exclude:
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
