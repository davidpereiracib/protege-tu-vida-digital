<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
<meta name="author" content="David Pereira — SecPro">
<meta name="theme-color" content="#0B2E63">

<meta property="og:type" content="website">
<meta property="og:locale" content="es_CO">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">

<meta property="og:image" content="{{ '/assets/img/secpro-color.png' | absolute_url }}">

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/img/secpro-icono-64.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/secpro-icono.png' | relative_url }}">
</head>
<body>

<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="sitio">
  <div class="wrap barra">
    <a class="marca" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/secpro-blanco-320.png' | relative_url }}"
           alt="SecPro — Security Professionals" width="160" height="56">
      <span class="marca-txt">
        <b>Protege tu Vida Digital</b>
        <small>David Pereira · SecPro</small>
      </span>
    </a>
    <nav>
      <a href="{{ '/indice/' | relative_url }}">Índice</a>
      <a href="{{ '/fraudes/' | relative_url }}">Kit antifraude</a>
      <a href="{{ '/CHECKLIST/' | relative_url }}">Checklist</a>
    </nav>
  </div>
</header>

<main id="contenido" class="wrap contenido">
  {{ content }}
</main>

<footer class="sitio">
  <div class="wrap pie">
    <div class="pie-marca">
      <img src="{{ '/assets/img/secpro-blanco-320.png' | relative_url }}"
           alt="SecPro" width="132" height="46">
      <div>
        <b>David Pereira</b> — CEO de SecPro<br>
        Material educativo y de concienciación · <a href="mailto:info@secpro.co">info@secpro.co</a>
      </div>
    </div>
    <div>
      <a href="https://github.com/davidpereiracib/protege-tu-vida-digital">Ver en GitHub</a> ·
      <a href="https://github.com/davidpereiracib/protege-tu-vida-digital/issues/new">Reportar un enlace roto</a> ·
      <a href="https://creativecommons.org/licenses/by/4.0/deed.es">CC BY 4.0</a>
    </div>
  </div>
</footer>

</body>
</html>
